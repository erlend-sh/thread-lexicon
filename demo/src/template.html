<script>
const $ = (s, el = document) => el.querySelector(s)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const SNAPSHOT_DATE = '__SNAPDATE__'
// a site can also be read by another client at its own url (views); each view shares the site's records, not a copy
const sites = JSON.parse($('#snapshot').textContent).flatMap(s => [s, ...(s.views || []).map(v => ({ ...s, view: v, simulated: v.simulated, layout: v.layout }))])
let cur = 0, view = { name: 'index' }

const rgb = c => c && Number.isInteger(c.r) ? `rgb(${c.r} ${c.g} ${c.b})` : null
const fmtDate = d => d ? new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : ''
const trimSlash = u => (u || '').replace(/\/+$/, '')
const canonical = (pub, doc) => trimSlash(pub.value.url) + (doc ? (doc.value.path || '') : '')
const siteUrl = s => s.view ? s.view.url : pubOf(s).value.url
const plural = (n, w, many) => n == null ? '' : `${n} ${n === 1 ? w : (many || w + 's')}`

function applyTheme(pub) {
  const t = pub.value.basicTheme, site = $('#site')
  for (const k of ['bg', 'fg', 'accent', 'accent-fg']) site.style.removeProperty('--site-' + k)
  if (!t) return false
  const map = { bg: t.background, fg: t.foreground, accent: t.accent, 'accent-fg': t.accentForeground }
  for (const [k, v] of Object.entries(map)) if (rgb(v)) site.style.setProperty('--site-' + k, rgb(v))
  return true
}

function renderPicker() {
  // the picker names each site by its domain, the way a reader would type it
  $('#pick').innerHTML = sites.map((s, i) => `<option value="${i}">${esc((siteUrl(s) || s.handle || s.did).replace(/^https?:\/\//, '').replace(/\/$/, ''))}${s.simulated ? ' (simulated)' : ''}</option>`).join('')
  $('#pick').value = cur
}

// the group is the space the threads live in: a community.lexicon.thread.group record
const pubOf = s => s.threadSite
function renderAddr(s, doc) {
  const url = s.view ? trimSlash(s.view.url) + (doc ? (doc.value.path || '') : '') : canonical(pubOf(s), doc)
  const m = url.match(/^(https?:\/\/)([^/]+)(.*)$/)
  $('#addr').innerHTML = m ? `<span>${m[1]}</span><b>${esc(m[2])}</b>${esc(m[3])}` : esc(url)
  const [pubType, docType] = [`${TL}.group`, `${TL}.thread`]
  if (s.view) { $('#verify').textContent = `${s.view.client} reading ${trimSlash(pubOf(s).value.url).replace(/^https?:\/\//, '')}'s records`; return }
  $('#verify').textContent = doc ? `verify: <link rel="${docType}">` : `verify: /.well-known/${pubType}`
}

const TL = 'community.lexicon.thread'
const items = s => s.threads
function render() {
  const s = sites[cur], pub = pubOf(s), v = pub.value
  const themed = applyTheme(pub)
  const doc = view.name === 'doc' ? items(s)[view.i] : null
  const P = 'thread.group'
  renderAddr(s, doc)
  const icon = s.iconData
  const head = `
    <header class="pub-head">
      ${icon ? `<img class="pub-icon" src="${esc(icon)}" alt="" data-field="${P}.icon">` : `<div class="pub-icon" aria-hidden="true" data-field="(no icon)">${esc((v.name || '?').trim()[0])}</div>`}
      <div style="min-width:0">
        <h1 class="pub-name" data-field="${P}.name" tabindex="0" id="homeLink">${esc(s.displayName || v.name)}</h1>
        ${v.description ? `<p class="pub-desc muted" data-field="${P}.description">${esc(v.description)}</p>` : ''}
      </div>
      <div class="pub-actions">
        ${followCtl(s, null, 'Subscribe')}
        <span class="count muted">${s.subscribers != null ? plural(s.subscribers + (subOf(s, null) ? 1 : 0), 'subscriber') : ''}</span>
        <span class="count muted">${themed ? '' : 'No basicTheme, so default colours'}</span>
      </div>
    </header>`
  const body = doc ? renderThread(s, doc) : renderThreadIndex(s)
  const sim = s.simulated ? `<div class="sim"><strong>Simulated.</strong> ${esc(s.simulated)}</div>` : ''
  // a post page focuses on the post: the publication header only shows on the index
  $('#site').innerHTML = `<div class="wrap view">${sim}${doc ? '' : head}${body}</div>
    <footer class="site-foot muted">Rendered from ${s.simulated ? `simulated records (${esc(SNAPSHOT_DATE)})` : `a snapshot taken ${esc(SNAPSHOT_DATE)}`} of <code>${esc(s.handle || s.did)}</code>. Only <code>${TL}.*</code> fields are used.</footer>`
  if (!doc) {
    $('#homeLink').onclick = () => go(cur)
    $('#homeLink').onkeydown = e => { if (e.key === 'Enter') $('#homeLink').click() }
  }
  $('#site').querySelectorAll('[data-doc]').forEach(b => b.onclick = e => { e.preventDefault(); go(cur, +b.dataset.doc) })
  addFieldLabels()
  const hb = $('#headsBtn'); if (hb) hb.onclick = () => { showHeads = !showHeads; try { localStorage.setItem('boardHeads', showHeads ? 'on' : 'off') } catch {}; render() }
  $('#site').querySelectorAll('[data-chan]').forEach(b => b.onclick = () => { chanFilter = b.dataset.chan ? { site: cur, uri: b.dataset.chan } : null; render() })
  $('#site').querySelectorAll('li[data-row], tr[data-row]').forEach(r => r.onclick = e => { if (!e.target.closest('button, a')) go(cur, +r.dataset.row) })
  const rec = $('#recBtn'); if (rec) rec.onclick = () => { rec.textContent = `Would write ${TL}.recommend` }
  const mb = $('#moreBtn'); if (mb) mb.onclick = () => { shownReplies += PAGE; render() }
  $('#site').querySelectorAll('[data-follow]').forEach(b => b.onclick = e => {
    e.stopPropagation()
    const k = b.dataset.follow
    if (subs.has(k)) subs.delete(k); else subs.set(k, { notify: null, createdAt: new Date().toISOString() })
    render()
  })
  $('#site').querySelectorAll('[data-notify]').forEach(sel => sel.onchange = () => { subs.get(sel.dataset.notify).notify = sel.value; render() })
  const rb = $('#replyBtn'); if (rb) rb.onclick = () => { rb.textContent = `Would write a ${TL}.post to your repo` }
}

/* field labels are real elements, so hovering one can light up exactly what it labels */
function addFieldLabels() {
  const label = (cls, text) => Object.assign(document.createElement('span'), { className: cls, textContent: text, ariaHidden: 'true' })
  // an image can't hold a label, so it gets a wrapper that carries its data-field
  $('#site').querySelectorAll('img[data-field]').forEach(img => {
    const wrap = Object.assign(document.createElement('span'), { className: 'img-field' })
    wrap.dataset.field = img.dataset.field; delete img.dataset.field
    img.replaceWith(wrap); wrap.append(img)
  })
  $('#site').querySelectorAll('[data-field]').forEach(el => el.append(label('fl', el.dataset.field)))
  $('#site').querySelectorAll('.rec').forEach(el => el.prepend(label('rl', el.dataset.rec)))
  // in the grid, a column's label lights up that column's cells
  const grid = $('#site').querySelector('.threadgrid')
  if (grid) grid.querySelectorAll('.fieldrow th').forEach((th, k) => {
    const cells = () => grid.querySelectorAll(`tbody td:nth-child(${k + 1})${th.colSpan > 1 ? `, tbody td:nth-child(${k + 2})` : ''}`), span = th.querySelector('span')
    span.onmouseenter = () => cells().forEach(td => td.classList.add('lit'))
    span.onmouseleave = () => cells().forEach(td => td.classList.remove('lit'))
  })
}

/* ---------- the board and its threads ---------- */
const initial = n => esc(((n || '?').replace(/^@/, '').trim()[0] || '?').toUpperCase())
// publishing both: a thread and a site.standard.document are one piece of writing when they sit in the same repo and point at each other
const repoOf = uri => uri.split('/')[2]
const pairLink = (s, rec) => {
  const d = rec.value.document && (s.documents || []).find(x => x.uri === rec.value.document)
  return d && repoOf(d.uri) === repoOf(rec.uri) && d.value.links?.thread === rec.uri
    ? `<div class="paired" data-field="document + defs#link"><span>Also published as an article, a <code>site.standard.document</code> on ${esc(s.publication.value.name)}, so standard.site readers show it too.</span></div>` : ''
}
const authorOf = (s, d) => d.author || { name: s.handle || s.did, handle: s.handle }
// activity comes only from records: the newest of the document's publishedAt / updatedAt and its replies' createdAt / updatedAt
const lastActivity = d => [d.value.publishedAt, d.value.updatedAt, ...(d.replies || []).flatMap(r => [r.value.createdAt, r.value.updatedAt])].filter(Boolean).sort().pop()
const ago = iso => {
  if (!iso) return ''
  const m = (Date.now() - new Date(iso)) / 60000
  return m < 60 ? `${Math.max(1, Math.round(m))}m` : m < 1440 ? `${Math.round(m / 60)}h` : m < 43200 ? `${Math.round(m / 1440)}d` : new Date(iso).toLocaleDateString('en', new Date(iso).getFullYear() === new Date().getFullYear() ? { month: 'short', day: 'numeric' } : { month: 'short', year: '2-digit' })
}
/* what each part of a board card is made of, shown under "Show record fields" */
const COLS = {
  faces: 'derived · post authors',
  chan: 'parent + thread.channel',
  num: 'derived · post count',
  age: 'derived · newest post',
}
const ICONS = {
  heads: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1.75 6.25h12.5M6 6.25v7" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="2.5" y="3.5" width="11" height="2.75" fill="currentColor" opacity=".35"/></svg>',
  replies: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3.5 3v-3h-1.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  activity: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.8V8l2.2 1.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
}
const hueOf = str => { let h = 7; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h }
const av = p => `<span class="av" title="${esc(p.name)}" style="background:oklch(46% .09 ${hueOf(p.handle || p.name)})">${initial(p.name)}</span>`
/* granular subscriptions: one community.lexicon.thread.subscription per group, or per thread within it (a channel is a thread) */
const subs = new Map()  // "siteUri|threadUri" -> { notify, createdAt }, the viewer's own records, kept in memory
const subKey = (s, threadUri) => `${pubOf(s).uri}|${threadUri || ''}`
const subOf = (s, threadUri) => subs.get(subKey(s, threadUri))
const NOTIFY = { posts: 'Every post', threads: 'New threads', none: 'No alerts' }
const notifyOf = (sub, threadUri) => sub.notify || (threadUri ? 'posts' : 'threads')
const subRecord = (s, threadUri, sub) => ({ $type: `${TL}.subscription`, group: pubOf(s).uri, ...(threadUri ? { thread: threadUri } : {}), ...(sub.notify ? { notify: sub.notify } : {}), createdAt: sub.createdAt })
function followCtl(s, threadUri, label) {
  const sub = subOf(s, threadUri), k = esc(subKey(s, threadUri))
  return `<span class="follow" data-field="${threadUri ? 'subscription: group + thread' : 'subscription: group'}">
    <button class="btn${sub ? ' ghost' : ''}" type="button" data-follow="${k}" aria-pressed="${!!sub}">${esc(sub ? (threadUri ? label.replace(/^Follow/, 'Following') : 'Subscribed') : label)}</button>
    ${sub ? `<select data-notify="${k}" aria-label="Notify me about">${Object.entries(NOTIFY).map(([v, t]) => `<option value="${v}"${notifyOf(sub, threadUri) === v ? ' selected' : ''}>${t}</option>`).join('')}</select>` : ''}
  </span>`
}
// the most specific subscription wins: the thread's own, then its parent chain (such as its channel); a whole-group one isn't marked on each card
function effectiveSub(s, d) {
  const byUri = Object.fromEntries([...items(s), ...(s.channels || [])].map(t => [t.uri, t]))
  for (let t = d, hops = 0; t && hops < 8; t = byUri[t.value.parent], hops++) {
    const sub = subOf(s, t.uri); if (sub) return { notify: notifyOf(sub, t.uri), via: t === d ? 'thread' : 'channel' }
  }
  return null
}
const mySubs = s => [...subs].filter(([k]) => k.startsWith(pubOf(s).uri + '|')).map(([k, sub]) => subRecord(s, k.split('|')[1], sub))
const mySubsRaw = s => { const r = mySubs(s); return r.length ? `<details class="raw"><summary>View your ${plural(r.length, TL + '.subscription record')}</summary><pre>${esc(JSON.stringify(r, null, 2))}</pre></details>` : '' }
ICONS.bell = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 11.5V7a4 4 0 0 1 8 0v4.5l1.2 1.2H2.8zM6.5 14h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>'
// a thread's description, or when none was written, the start of its opening post: up to 300 characters, at most 3 paragraphs
const DESC_MAX = 300, DESC_PARAS = 3
function threadDesc(v) {
  if (v.description) return { paras: v.description.split(/\n{2,}/).map(p => p.trim()).filter(Boolean), derived: false }
  const out = []; let left = DESC_MAX
  for (const p of (v.textContent || '').split(/\n{2,}/).map(p => p.replace(/\s+/g, ' ').trim()).filter(Boolean).slice(0, DESC_PARAS)) {
    if (p.length <= left) { out.push(p); left -= p.length; continue }
    const cut = p.slice(0, left), sp = cut.lastIndexOf(' ')
    out.push((sp > left * .6 ? cut.slice(0, sp) : cut).replace(/[\s,.;:–-]+$/, '') + '…'); break
  }
  return { paras: out, derived: true }
}
// channels always show in lower case; the record keeps whatever case its title was written in
const chanName = c => `${c.channel?.icon || '#'} ${(c.value.title || '').toLowerCase()}`
// the grid board: the same records as the cards, in columns, one line per thread
const GRID_COLS = [['title', 'Thread'], ['chan', 'Channel'], ['faces', 'Posters'], ['num', 'Replies', ICONS.replies], ['age', 'Activity', ICONS.activity]]
function renderGrid(s, rows, chans) {
  return `<div class="board-tools"><button type="button" id="headsBtn" class="icon-toggle" aria-pressed="${showHeads}" title="${showHeads ? 'Hide' : 'Show'} column headers" aria-label="Column headers">${ICONS.heads}</button></div>
    <table class="threadgrid">
    <colgroup>${GRID_COLS.map(([k]) => `<col class="c-${k}">`).join('')}</colgroup>
    <thead><tr class="headrow"${showHeads ? '' : ' hidden'}>${GRID_COLS.map(([k, label, icon]) => `<th class="c-${k}"${icon ? ` title="${label}" aria-label="${label}"` : ''}>${icon || label}</th>`).join('')}</tr>
      <tr class="fieldrow">${GRID_COLS.filter(([k]) => k !== 'age').map(([k]) => `<th class="c-${k}"${k === 'num' ? ' colspan="2"' : ''}><span>${k === 'title' ? 'thread.title' : k === 'num' ? 'derived · from posts' : COLS[k]}</span></th>`).join('')}</tr></thead>
    <tbody>${rows.map(({ d, i, act }) => {
      const n = d.replies?.length || 0
      const people = [authorOf(s, d), ...(d.replies || []).map(r => r.author).filter(Boolean)]
      const faces = [...new Map(people.map(p => [p.handle || p.name, p])).values()].slice(0, 5)
      const parent = chans[d.value.parent], fs = effectiveSub(s, d)
      return `<tr data-row="${i}">
        <td class="title-cell"><a class="title" href="#site-${cur}-doc-${i}" data-doc="${i}" title="${esc(d.value.title)}">${esc(d.value.title)}</a>${fs ? `<span class="following" title="Following this ${fs.via}">${ICONS.bell}</span>` : ''}</td>
        <td class="chan-cell">${parent ? `<button type="button" class="chan" data-chan="${esc(parent.uri)}" title="Show only ${esc(chanName(parent))}">${esc(chanName(parent))}</button>` : '<span class="muted">—</span>'}</td>
        <td class="faces-cell"><div class="faces" title="${n + 1} posts">${faces.map(av).join('')}</div></td>
        <td class="num" title="${plural(n, 'reply', 'replies')}">${n}</td>
        <td class="age" title="${act ? `Last activity ${fmtDate(act)}` : ''}">${ago(act)}</td>
      </tr>`
    }).join('')}</tbody></table>`
}
// the grid's column headers are off by default; the toggle remembers the choice in this browser
let showHeads = false
try { showHeads = localStorage.getItem('boardHeads') === 'on' } catch {}
function renderThreadIndex(s) {
  if (!items(s).length) return `<p class="notice">This group has no ${TL}.thread records yet.</p>`
  const chans = Object.fromEntries((s.channels || []).map(c => [c.uri, c]))
  const only = chanFilter?.site === cur ? chans[chanFilter.uri] : null
  const rows = items(s).map((d, i) => ({ d, i, act: lastActivity(d) })).filter(r => !only || r.d.value.parent === only.uri).sort((a, b) => (b.act || '').localeCompare(a.act || ''))
  // the first card carries the field labels, so they show once rather than on every row
  const f = (k, field) => k ? '' : ` data-field="${field}"`
  const bar = `${only ? `<div class="chan-filter"><button type="button" class="chan" data-chan="" title="Show all channels">${esc(chanName(only))} ✕</button><span class="muted">${esc(only.channel?.description || only.value.description || '')}</span></div>` : ''}`
  // a site can choose the denser grid board; everyone else gets cards
  const list = s.layout === 'grid' ? renderGrid(s, rows, chans) : `<ol class="threadlist">${rows.map(({ d, i, act }, k) => {
      const n = d.replies?.length || 0
      const people = [authorOf(s, d), ...(d.replies || []).map(r => r.author).filter(Boolean)]
      const faces = [...new Map(people.map(p => [p.handle || p.name, p])).values()].slice(0, 5)
      const parent = chans[d.value.parent]
      return `<li data-row="${i}">
        <div class="t-top"><a class="title" href="#site-${cur}-doc-${i}" data-doc="${i}"${f(k, 'thread.title')}>${esc(d.value.title)}</a><span class="t-meta"><span class="t-age" title="${act ? `Last activity ${fmtDate(act)}` : ''}"${f(k, COLS.age)}>${ago(act)}</span><span class="stat" title="${plural(n, 'reply', 'replies')}"${f(k, COLS.num)}>${ICONS.replies}${n}</span></span>
          <span class="t-tags">${parent ? `<button type="button" class="chan" data-chan="${esc(parent.uri)}" title="Show only ${esc(chanName(parent))}"${f(k, COLS.chan)}>${esc(chanName(parent))}</button>` : `<span class="chan muted"${f(k, COLS.chan)}>no channel</span>`}
          ${(fs => fs ? `<span class="following" title="Following this ${fs.via}">${ICONS.bell}${NOTIFY[fs.notify]}</span>` : '')(effectiveSub(s, d))}
          <div class="faces" title="${n + 1} posts"${f(k, COLS.faces)}>${faces.map(av).join('')}</div></span></div>
        ${(td => td.paras.length ? `<div class="t-desc"${f(k, td.derived ? 'derived · textContent, 300 chars / 3 ¶' : 'thread.description')}>${td.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>` : '')(threadDesc(d.value))}
      </li>`
    }).join('')}</ol>`
  return `${bar}${list}
    <p class="muted board-note">These are <code>${TL}.thread</code> records, a fork of standard.site's document for threads. The channel is the thread's <code>parent</code>, named by a <code>${TL}.channel</code> record. Posters, replies and activity are derived from <code>${TL}.post</code> records. Subscribe to the whole group here, or open a thread to follow just it or its channel. Each is one <code>${TL}.subscription</code> in your repo, and the most specific one wins.</p>
    ${mySubsRaw(s)}`
}
const PAGE = 10
let shownReplies = PAGE, shownFor = null
let chanFilter = null  // { site, uri }: the channel the board is narrowed to, until the reader clears it
function renderThread(s, d) {
  const v = d.value, a = authorOf(s, d), all = d.replies || []
  if (shownFor !== d.uri) { shownFor = d.uri; shownReplies = PAGE }
  const replies = all.slice(0, shownReplies), more = all.length - replies.length
  const pubName = s.displayName || pubOf(s).value.name, pubIcon = s.iconData
  const chan = (s.channels || []).find(c => c.uri === v.parent)
  const num = Object.fromEntries(all.map((r, k) => [r.uri, { n: k + 2, who: r.author?.name || 'someone' }]))
  const bsky = v.bskyPostRef?.uri?.match(/^at:\/\/([^/]+)\/app\.bsky\.feed\.post\/(.+)$/)
  const postHead = (who, handle, when, n, field) => `<div class="tpost-head"><b data-field="author: repo DID → handle">${esc(who)}</b>${handle && handle !== who ? `<span class="muted">@${esc(handle)}</span>` : ''}<span class="muted" title="${esc(when)}" data-field="${field}">${fmtDate(when)}</span><span class="n muted">#${n}</span></div>`
  return `<article>
    <button class="back" type="button" id="backBtn">← All threads in ${pubIcon ? `<img class="mini" src="${esc(pubIcon)}" alt="">` : `<span class="mini" aria-hidden="true">${esc((pubName || '?').trim()[0])}</span>`} <b>${esc(pubName)}</b></button>
    <div class="follow-row">${followCtl(s, d.uri, 'Follow thread')}${chan ? followCtl(s, chan.uri, `Follow ${chanName(chan)}`) : ''}</div>
    <section class="rec rec-doc" data-rec="${esc(v.$type)} · ${esc(a.handle || a.name)}">
      <h2 class="thread-title" data-field="title">${esc(v.title)}</h2>
      ${v.tags?.length ? `<div class="tags" data-field="tags">${v.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
      <div class="tpost op"><div class="avatar" aria-hidden="true">${initial(a.name)}</div><div style="min-width:0">
        ${postHead(a.name, a.handle, v.publishedAt, 1, 'publishedAt')}
        ${docBody(s, d)}
      </div></div>
      ${pairLink(s, d)}
    </section>
    <ol class="stream">
      ${replies.map((r, k) => {
        const to = r.value.replyTo && num[r.value.replyTo]
        const paras = (r.value.textContent || '').split(/\n{2,}/).map(p => p.trim()).filter(Boolean)
        return `<li class="tpost rec rec-post" data-rec="${TL}.post · ${esc(r.author?.handle || r.author?.name || 'someone')}"><div class="avatar" aria-hidden="true">${initial(r.author?.name)}</div><div style="min-width:0">
          ${postHead(r.author?.name || 'someone', r.author?.handle, r.value.createdAt, k + 2, 'createdAt')}
          ${to ? `<div class="replying muted" data-field="replyTo">↩ replying to ${esc(to.who)} (#${to.n})</div>` : ''}
          <div class="body" data-field="textContent">${paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>
        </div></li>`
      }).join('')}
    </ol>
    ${more > 0 ? `<div class="more"><button class="btn ghost" type="button" id="moreBtn">Show ${Math.min(PAGE, more)} more ${more === 1 ? 'reply' : 'replies'}</button><span class="muted">${replies.length} of ${all.length} shown</span></div>` : ''}
    ${all.length ? '' : `<div class="notice">No ${TL}.post records point at this thread yet, so the thread is just its opening post.${bsky ? ` Its publisher keeps the conversation on <a href="https://bsky.app/profile/${bsky[1]}/post/${bsky[2]}" target="_blank" rel="noopener">Bluesky</a> instead (bskyPostRef).` : ''}</div>`}
    <div class="composer">
      <label class="lbl" for="replyBox">Reply</label>
      <textarea id="replyBox" placeholder="Write a reply…"></textarea>
      <button class="btn" type="button" id="replyBtn">Post reply</button>
    </div>
    <footer class="doc-foot">
      <div class="pub-actions" style="display:flex">
        <button class="btn ghost" type="button" id="recBtn" data-field="graph.recommend">Recommend</button>
        <span class="count muted">${d.recommends != null ? plural(d.recommends, 'recommend') : ''}</span>
      </div>
      ${mySubsRaw(s)}
      <details class="raw"><summary>View the ${esc(v.$type)} record</summary><pre>${esc(JSON.stringify({ uri: d.uri, value: v }, null, 2))}</pre></details>
      ${replies.length ? `<details class="raw"><summary>View the ${plural(replies.length, TL + '.post record')} shown</summary><pre>${esc(JSON.stringify(replies.map(r => ({ uri: r.uri, value: r.value })), null, 2))}</pre></details>` : ''}
    </footer>
  </article>`
}

function docBody(s, d) {
  const paras = (d.value.textContent || '').split(/\n{2,}/).map(p => p.trim()).filter(Boolean)
  return paras.length ? `<div class="body" data-field="textContent">${paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`
    : `<div class="notice">This thread has no <code>textContent</code>.</div>`
}

document.addEventListener('click', e => { if (e.target.closest('#backBtn')) go(cur) })

/* each page gets a hash (#site-1, #site-1-doc-4), so the browser's back and forward buttons work */
function go(site, doc) {
  const h = doc == null ? `site-${site}` : `site-${site}-doc-${doc}`
  if (location.hash === '#' + h) route(); else location.hash = h
}
function route() {
  const m = location.hash.match(/^#site-(\d+)(?:-doc-(\d+))?$/)
  const s = m && sites[+m[1]] ? +m[1] : 0
  const d = m && m[2] != null && items(sites[s])[+m[2]] ? +m[2] : null
  const changed = s !== cur || (d == null ? view.name !== 'index' : view.i !== d)
  cur = s; view = d == null ? { name: 'index' } : { name: 'doc', i: d }
  $('#pick').value = cur; render()
  if (changed) scrollTo(0, 0)
}
addEventListener('hashchange', route)
$('#pick').onchange = e => go(+e.target.value)
$('#fieldsBtn').onclick = e => {
  const on = e.target.getAttribute('aria-pressed') !== 'true'
  e.target.setAttribute('aria-pressed', on); $('#site').classList.toggle('fields', on)
}

renderPicker(); route()
</script>
